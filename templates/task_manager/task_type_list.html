{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="list-and-create-btns">
      <h1>Task Type List
      </h1>
      <a class="btn btn-bd-primary create" href="{% url "task_manager:task-type-create" %}">Create Task Type</a>
    </div>

    {% if tasktype_list %}
      <table class="table">
        <tr>
          <th>ID</th>
          <th>Name</th>
        </tr>
        {% for task_type in tasktype_list %}
          <tr>
            <td>{{ task_type.id }}</td>
            <td>{{ task_type.name }}</td>
          </tr>
        {% endfor %}
      </table>
      </div>
    {% else %}
      <div>
        <p>There are no position in the service.</p>
      </div>
    {% endif %}
{% endblock %}
