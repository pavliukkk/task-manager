{% extends "base.html" %}

{% block content %}
  <div class="container">
    <h1>Task Types List
    </h1>

    {% if tasktype_list %}
      <table class="table">
        <tr>
          <th>ID</th>
          <th>Name</th>
        </tr>
        {% for task_type in tasktype_list %}
          <tr>
            <td>{{ task_type.id }}</td>
            <td>{{ task_type.name }}</td>
          </tr>
        {% endfor %}
      </table>
      </div>
    {% else %}
      <div>
        <p>There are no position in the service.</p>
      </div>
    {% endif %}
{% endblock %}
