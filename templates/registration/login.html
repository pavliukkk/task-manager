{% extends "base.html" %}

{% block content %}
  <div class="container col-xl-10 col-xxl-8 px-4 py-5">
    <div class="row align-items-center g-lg-5 py-5">
      <div class="col-lg-7 text-center text-lg-start">
        <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">
          Login page
        </h1>
        <p class="col-lg-10 fs-4">
          Authenticate to access the Task Manager system and manage organizational tasks, workers, positions, and task
          types.
        </p>
      </div>
      <div class="col-md-10 mx-auto col-lg-5">
        <form method="post" action="" class="p-4 p-md-5 border rounded-3 bg-body-tertiary">
          {% csrf_token %}
          <div class="form-floating mb-3">
            <input
                name="username"
                type="text"
                class="form-control"
                id="floatingInput"
                placeholder="Username"
            />
            <label for="floatingInput">Username</label>
          </div>
          <div class="form-floating mb-3">
            <input
                type="password"
                name="password"
                class="form-control"
                id="floatingPassword"
                placeholder="Password"
            />
            <label for="floatingPassword">Password</label>
          </div>
          <div class="checkbox mb-3">
          </div>
          <button class="w-100 btn btn-lg btn-primary" type="submit">
            Login
          </button>
          <hr class="my-4"/>
          <small class="text-body-secondary" style="text-align: center"
          >Welcome back! Sign in to continue managing your team's workflow.</small
          >
        </form>
      </div>
    </div>
  </div>
{% endblock %}
